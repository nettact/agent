# Release pipeline for the NetTact agent.
#
# Trigger: pushing a semver tag (v0.4.0, v0.4.0-rc.1). Versioning is independent of
# server/desktop — the tag version is stamped into the binary via ldflags
# (agentrt.Version) and reported to the server at enrollment / in Hello frames.
#
# Sibling-repo sources are NOT pinned in this repo: the workflow checks out
# nettact/protocol's default branch and records the commit it resolved to, so
# releases never wait on a sibling tag and nobody has to hand-maintain a SHA.
# Every build publishes nettact-agent-dependencies.json naming that exact commit.
# The `prepare` job resolves it ONCE and every later job checks out that exact
# commit, so a protocol push mid-run cannot leave one architecture built against
# different sources than the rest.
#
# The trade: a tag no longer rebuilds identically on its own, because protocol
# moves. To reproduce a published release, pass its recorded commit as the
# protocol_ref dispatch input below.
#
# Required secret: CI_SUBMODULE_SSH_KEY (org-level recommended) — read access to
# nettact/protocol and nettact/docs. GHCR auth uses GITHUB_TOKEN; cosign is
# keyless OIDC.

# Public downloads are served by the d.nettact.org Cloudflare Worker directly
# from this private GitHub Release. No release asset is copied to R2.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.4.0
        required: true
      protocol_ref:
        description: >-
          protocol commit to build against. Empty resolves the default branch's
          latest commit. When re-releasing an existing tag, pass the commit from
          that release's nettact-agent-dependencies.json — otherwise protocol has
          moved since and the rebuilt artifacts differ from the published ones.
        required: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Resolve · test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.rel.outputs.version }}
      sha: ${{ steps.rel.outputs.sha }}
      sha_short: ${{ steps.rel.outputs.sha_short }}
      is_latest: ${{ steps.rel.outputs.is_latest }}
      protocol_sha: ${{ steps.deps.outputs.protocol_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: agent
          fetch-depth: 0          # need all tags to decide whether this is the newest stable

      # workflow_dispatch runs from a branch ref, so github.sha is the DISPATCH commit,
      # not the released tag's commit — using it for sha-* image tags / OCI revision
      # would label the image with code it doesn't contain. Resolve the real release
      # commit from the checkout, and only move `latest` when this tag is the newest
      # stable tag (re-releasing an old tag must not roll `latest` backward).
      - name: Resolve release commit + latest eligibility
        id: rel
        run: |
          set -euo pipefail
          cd agent
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "version=$TAG" >> "$GITHUB_OUTPUT"
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"   # prerelease never moves latest
          else
            newest=$(git tag -l 'v*' | grep -v -- - | sort -V | tail -1)
            echo "newest stable tag: $newest (releasing: $TAG)"
            [ "$TAG" = "$newest" ] && echo "is_latest=true" >> "$GITHUB_OUTPUT" \
                                   || echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      # An empty ref makes actions/checkout use the repository's default branch,
      # which is how "latest protocol" is expressed here. The commit that lands is
      # whatever the default branch pointed at the moment this step ran; the next
      # step reads it back rather than assuming it.
      - name: Checkout protocol
        uses: actions/checkout@v4
        with:
          repository: nettact/protocol
          ref: ${{ inputs.protocol_ref }}
          path: protocol
          ssh-key: ${{ secrets.CI_SUBMODULE_SSH_KEY }}

      # With no committed pin, the dependency record IS the audit trail: it is the
      # only place that says which protocol source this binary contains. Published
      # as a Release asset so it outlives the workflow run's log retention.
      - name: Record dependency commits
        id: deps
        run: |
          set -euo pipefail
          protocol_sha=$(git -C protocol rev-parse HEAD)
          [[ "$protocol_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "protocol checkout did not resolve to a full commit (got '$protocol_sha')" >&2
            exit 1
          }
          echo "protocol_sha=$protocol_sha" >> "$GITHUB_OUTPUT"

          mkdir -p dist-out
          jq -n \
            --arg agent_version "${{ inputs.tag || github.ref_name }}" \
            --arg agent_sha "${{ steps.rel.outputs.sha }}" \
            --arg protocol_sha "$protocol_sha" \
            '{
              schema_version: 1,
              agent: {version: $agent_version, commit: $agent_sha},
              sources: {
                protocol: {commit: $protocol_sha}
              }
            }' > dist-out/nettact-agent-dependencies.json
          (
            cd dist-out
            sha256sum nettact-agent-dependencies.json > nettact-agent-dependencies.json.sha256
          )
          cat dist-out/nettact-agent-dependencies.json
          {
            echo "## Resolved dependency sources"
            echo
            echo "- protocol: \`$protocol_sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # Not a build dependency and deliberately not recorded as one — the gate
      # below runs openwrt/reasoncatalog_test.go, which reads
      # ../../docs/{en,zh}/agent-config.md to hold the failure-reason tables to
      # the Go constants that produce them. Without this checkout the test does
      # not skip, it fails on os.ReadFile, so the release gate is red on a
      # checkout that merely lacks a sibling repo (which is exactly how v0.4.0
      # failed). CI does the same; this keeps the two gates identical.
      - name: Checkout docs
        uses: actions/checkout@v4
        with:
          repository: nettact/docs
          path: docs
          ssh-key: ${{ secrets.CI_SUBMODULE_SSH_KEY }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            agent/go.sum
            protocol/go.sum

      - name: Assemble workspace (trimmed go.work + versioned replace)
        run: |
          set -euo pipefail
          go work init ./protocol ./agent
          go work edit -replace github.com/nettact/protocol@v0.0.0-00010101000000-000000000000=./protocol

      # Both build graphs are gated, because they are genuinely different
      # programs: the lite tag compiles out the WireGuard egress and swaps the
      # outbox for a memory-only one, and nothing else in CI would notice if one
      # of them stopped compiling.
      - name: Gate — vet · build · test (default)
        run: |
          set -euo pipefail
          ( cd agent && go vet ./... && go build ./... && go test ./... )

      - name: Gate — vet · build · test (lite)
        run: |
          set -euo pipefail
          ( cd agent && go vet -tags lite ./... && go build -tags lite ./... && go test -tags lite ./... )

      - uses: actions/upload-artifact@v4
        with:
          name: dependency-record
          path: dist-out/
          retention-days: 1

  build:
    name: ${{ matrix.asset }}
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          # Full builds. Names and contents are unchanged from before the
          # router targets existed — installers and the download worker
          # reference them literally.
          - { asset: nettact-agent-linux-amd64,       goos: linux,   goarch: amd64 }
          - { asset: nettact-agent-linux-arm64,       goos: linux,   goarch: arm64 }
          - { asset: nettact-agent-darwin-amd64,      goos: darwin,  goarch: amd64 }
          - { asset: nettact-agent-darwin-arm64,      goos: darwin,  goarch: arm64 }
          - { asset: nettact-agent-windows-amd64.exe, goos: windows, goarch: amd64 }

          # Router builds: -tags lite (no WireGuard egress, memory-only outbox)
          # and UPX-compressed, because these are downloaded over a home WAN
          # onto a device that may keep them in RAM.
          - { asset: nettact-agent-lite-linux-amd64,  goos: linux, goarch: amd64,  lite: true, upx: true }
          - { asset: nettact-agent-lite-linux-386,    goos: linux, goarch: '386',  lite: true, upx: true, go386: softfloat }
          - { asset: nettact-agent-lite-linux-arm64,  goos: linux, goarch: arm64,  lite: true, upx: true }
          - { asset: nettact-agent-lite-linux-armv5,  goos: linux, goarch: arm,    lite: true, upx: true, goarm: '5' }
          - { asset: nettact-agent-lite-linux-armv6,  goos: linux, goarch: arm,    lite: true, upx: true, goarm: '6' }
          - { asset: nettact-agent-lite-linux-armv7,  goos: linux, goarch: arm,    lite: true, upx: true, goarm: '7' }
          - { asset: nettact-agent-lite-linux-mips-softfloat,   goos: linux, goarch: mips,   lite: true, upx: true, gomips: softfloat }
          - { asset: nettact-agent-lite-linux-mipsle-softfloat, goos: linux, goarch: mipsle, lite: true, upx: true, gomips: softfloat }
          # UPX has no riscv64 packer, so this one ships uncompressed. fetch.sh
          # does not care: it verifies the checksum and runs whatever it got.
          - { asset: nettact-agent-lite-linux-riscv64, goos: linux, goarch: riscv64, lite: true }
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: agent

      - name: Checkout protocol
        uses: actions/checkout@v4
        with:
          repository: nettact/protocol
          ref: ${{ needs.prepare.outputs.protocol_sha }}
          path: protocol
          ssh-key: ${{ secrets.CI_SUBMODULE_SSH_KEY }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            agent/go.sum
            protocol/go.sum

      - name: Assemble workspace (trimmed go.work + versioned replace)
        run: |
          set -euo pipefail
          go work init ./protocol ./agent
          go work edit -replace github.com/nettact/protocol@v0.0.0-00010101000000-000000000000=./protocol

      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          GOMIPS: ${{ matrix.gomips }}
          GO386: ${{ matrix.go386 }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          mkdir -p dist-bins
          TAGS=""
          [ "${{ matrix.lite || false }}" = "true" ] && TAGS="-tags lite"
          ( cd agent && go build $TAGS -trimpath \
              -ldflags "-s -w -X github.com/nettact/agent/agentrt.Version=${VERSION}" \
              -o "../dist-bins/${{ matrix.asset }}" ./cmd/nettact-agent )
          ls -l "dist-bins/${{ matrix.asset }}"

      - name: Compress (UPX)
        if: matrix.upx
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq upx-ucl
          upx --best --lzma "dist-bins/${{ matrix.asset }}"
          upx -t "dist-bins/${{ matrix.asset }}"
          ls -l "dist-bins/${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.asset }}
          path: dist-bins/${{ matrix.asset }}
          retention-days: 1
          if-no-files-found: error

  publish:
    name: Package · publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    environment: release          # manual-approval gate
    permissions:
      contents: write             # GitHub Release
      packages: write             # push to GHCR
      id-token: write             # cosign keyless (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: agent

      - name: Checkout protocol
        uses: actions/checkout@v4
        with:
          repository: nettact/protocol
          ref: ${{ needs.prepare.outputs.protocol_sha }}
          path: protocol
          ssh-key: ${{ secrets.CI_SUBMODULE_SSH_KEY }}

      - uses: actions/download-artifact@v4
        with:
          name: dependency-record
          path: dist-out

      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          path: dist-bins
          merge-multiple: true

      # The OpenWrt packages carry no binary — the agent is downloaded on the
      # router — so they are assembled here rather than in the build matrix, and
      # need no cross toolchain.
      - name: Build OpenWrt packages
        run: |
          set -euo pipefail
          sh agent/openwrt/test-scripts.sh
          sh agent/openwrt/build-ipk.sh "${{ needs.prepare.outputs.version }}" dist-bins

      - name: Checksums
        run: |
          set -euo pipefail
          ( cd dist-bins && sha256sum * > SHA256SUMS && cat SHA256SUMS )

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nettact-agent
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.is_latest }}
            type=raw,value=sha-${{ needs.prepare.outputs.sha_short }}

      - name: Build & push image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/ci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            REVISION=${{ needs.prepare.outputs.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, by digest)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nettact-agent
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(needs.prepare.outputs.version, '-') }}
          files: |
            dist-bins/nettact-agent-linux-amd64
            dist-bins/nettact-agent-linux-arm64
            dist-bins/nettact-agent-darwin-amd64
            dist-bins/nettact-agent-darwin-arm64
            dist-bins/nettact-agent-windows-amd64.exe
            dist-bins/nettact-agent-lite-linux-amd64
            dist-bins/nettact-agent-lite-linux-386
            dist-bins/nettact-agent-lite-linux-arm64
            dist-bins/nettact-agent-lite-linux-armv5
            dist-bins/nettact-agent-lite-linux-armv6
            dist-bins/nettact-agent-lite-linux-armv7
            dist-bins/nettact-agent-lite-linux-mips-softfloat
            dist-bins/nettact-agent-lite-linux-mipsle-softfloat
            dist-bins/nettact-agent-lite-linux-riscv64
            dist-bins/nettact-agent.ipk
            dist-bins/luci-app-nettact.ipk
            dist-bins/SHA256SUMS
            dist-out/nettact-agent-dependencies.json
            dist-out/nettact-agent-dependencies.json.sha256
          body: |
            ## nettact-agent ${{ needs.prepare.outputs.version }}

            Built against `nettact/protocol@${{ needs.prepare.outputs.protocol_sha }}`,
            resolved from that repo's default branch when this build started.
            `nettact-agent-dependencies.json` is the machine-readable record of it —
            desktop packaging reads it to build this agent against the same protocol
            source, and re-releasing this tag reproducibly means passing that commit
            as the workflow's `protocol_ref` input.

            ### OpenWrt
            ```
            opkg install https://d.nettact.org/agent/nettact-agent.ipk
            opkg install https://d.nettact.org/agent/luci-app-nettact.ipk
            ```
            The packages contain no binary: the router downloads the matching
            `nettact-agent-lite-linux-*` build on first start, into RAM or onto
            flash as configured. Those builds leave out the WireGuard egress and
            keep their telemetry buffer in memory only.

            ### Container image (linux/amd64 · linux/arm64, cosign-signed)
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/nettact-agent:${{ needs.prepare.outputs.version }}
            ```
            Verify binary integrity with `sha256sum -c SHA256SUMS`.
