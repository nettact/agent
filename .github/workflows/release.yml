# Release pipeline for the NetTact agent.
#
# Trigger: pushing a semver tag (v0.4.0, v0.4.0-rc.1). Versioning is independent of
# server-lite/desktop — the tag version is stamped into the binary via ldflags
# (agentrt.Version) and reported to the server at enrollment / in Hello frames.
#
# Sibling-repo sources are pinned by ci/deps.env (PROTOCOL_SHA): the workflow checks
# out nettact/protocol at that exact commit, so releases never wait on a sibling tag
# and the same tag always rebuilds identically.
#
# Required secret: CI_SUBMODULE_SSH_KEY (org-level recommended) — read access to
# nettact/protocol. GHCR auth uses GITHUB_TOKEN; cosign is keyless OIDC.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.4.0
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Test · build · publish
    runs-on: ubuntu-latest
    environment: release          # manual-approval gate
    permissions:
      contents: write             # GitHub Release
      packages: write             # push to GHCR
      id-token: write             # cosign keyless (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: agent
          fetch-depth: 0          # need all tags to decide whether this is the newest stable

      # workflow_dispatch runs from a branch ref, so github.sha is the DISPATCH commit,
      # not the released tag's commit — using it for sha-* image tags / OCI revision
      # would label the image with code it doesn't contain. Resolve the real release
      # commit from the checkout, and only move `latest` when this tag is the newest
      # stable tag (re-releasing an old tag must not roll `latest` backward).
      - name: Resolve release commit + latest eligibility
        id: rel
        run: |
          set -euo pipefail
          cd agent
          TAG="${{ inputs.tag || github.ref_name }}"
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"   # prerelease never moves latest
          else
            newest=$(git tag -l 'v*' | grep -v -- - | sort -V | tail -1)
            echo "newest stable tag: $newest (releasing: $TAG)"
            [ "$TAG" = "$newest" ] && echo "is_latest=true" >> "$GITHUB_OUTPUT" \
                                   || echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read sibling-repo pins
        id: deps
        run: |
          set -euo pipefail
          source agent/ci/deps.env
          echo "protocol_sha=${PROTOCOL_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout protocol @ pinned SHA
        uses: actions/checkout@v4
        with:
          repository: nettact/protocol
          ref: ${{ steps.deps.outputs.protocol_sha }}
          path: protocol
          ssh-key: ${{ secrets.CI_SUBMODULE_SSH_KEY }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            agent/go.sum
            protocol/go.sum

      - name: Assemble workspace (trimmed go.work + versioned replace)
        run: |
          set -euo pipefail
          go work init ./protocol ./agent
          go work edit -replace github.com/nettact/protocol@v0.0.0-00010101000000-000000000000=./protocol

      - name: Gate — vet · build · test
        run: |
          set -euo pipefail
          ( cd agent && go vet ./... && go build ./... && go test ./... )

      - name: Cross-compile binaries + checksums
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag || github.ref_name }}"
          LDFLAGS="-s -w -X github.com/nettact/agent/agentrt.Version=${VERSION}"
          mkdir -p dist-bins
          for target in linux/amd64 linux/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            ( cd agent && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags "$LDFLAGS" \
                -o "../dist-bins/nettact-agent-${os}-${arch}${ext}" ./cmd/nettact-agent )
          done
          ( cd dist-bins && sha256sum * > SHA256SUMS && cat SHA256SUMS )

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nettact-agent
          tags: |
            type=raw,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ steps.rel.outputs.is_latest }}
            type=raw,value=sha-${{ steps.rel.outputs.sha_short }}

      - name: Build & push image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/ci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag || github.ref_name }}
            REVISION=${{ steps.rel.outputs.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, by digest)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nettact-agent
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: |
            dist-bins/nettact-agent-linux-amd64
            dist-bins/nettact-agent-linux-arm64
            dist-bins/nettact-agent-windows-amd64.exe
            dist-bins/SHA256SUMS
          body: |
            ## nettact-agent ${{ inputs.tag || github.ref_name }}

            Built against `nettact/protocol@${{ steps.deps.outputs.protocol_sha }}`.

            ### Container image (linux/amd64 · linux/arm64, cosign-signed)
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/nettact-agent:${{ inputs.tag || github.ref_name }}
            ```
            Verify binary integrity with `sha256sum -c SHA256SUMS`.
