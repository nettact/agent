# Release pipeline for the NetTact agent.
#
# Trigger: pushing a semver tag (v0.4.0, v0.4.0-rc.1). Versioning is independent of
# server-lite/desktop — the tag version is stamped into the binary via ldflags
# (agentrt.Version) and reported to the server at enrollment / in Hello frames.
#
# Sibling-repo sources are pinned by ci/deps.env (PROTOCOL_SHA): the workflow checks
# out nettact/protocol at that exact commit, so releases never wait on a sibling tag
# and the same tag always rebuilds identically.
#
# Required secret: CI_SUBMODULE_SSH_KEY (org-level recommended) — read access to
# nettact/protocol. GHCR auth uses GITHUB_TOKEN; cosign is keyless OIDC.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v0.4.0
        required: true

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Test · build · publish
    runs-on: ubuntu-latest
    environment: release          # manual-approval gate
    outputs:
      is_latest: ${{ steps.rel.outputs.is_latest }}
    permissions:
      contents: write             # GitHub Release
      packages: write             # push to GHCR
      id-token: write             # cosign keyless (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: agent
          fetch-depth: 0          # need all tags to decide whether this is the newest stable

      # workflow_dispatch runs from a branch ref, so github.sha is the DISPATCH commit,
      # not the released tag's commit — using it for sha-* image tags / OCI revision
      # would label the image with code it doesn't contain. Resolve the real release
      # commit from the checkout, and only move `latest` when this tag is the newest
      # stable tag (re-releasing an old tag must not roll `latest` backward).
      - name: Resolve release commit + latest eligibility
        id: rel
        run: |
          set -euo pipefail
          cd agent
          TAG="${{ inputs.tag || github.ref_name }}"
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"   # prerelease never moves latest
          else
            newest=$(git tag -l 'v*' | grep -v -- - | sort -V | tail -1)
            echo "newest stable tag: $newest (releasing: $TAG)"
            [ "$TAG" = "$newest" ] && echo "is_latest=true" >> "$GITHUB_OUTPUT" \
                                   || echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read sibling-repo pins
        id: deps
        run: |
          set -euo pipefail
          source agent/ci/deps.env
          echo "protocol_sha=${PROTOCOL_SHA}" >> "$GITHUB_OUTPUT"

      - name: Checkout protocol @ pinned SHA
        uses: actions/checkout@v4
        with:
          repository: nettact/protocol
          ref: ${{ steps.deps.outputs.protocol_sha }}
          path: protocol
          ssh-key: ${{ secrets.CI_SUBMODULE_SSH_KEY }}

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            agent/go.sum
            protocol/go.sum

      - name: Assemble workspace (trimmed go.work + versioned replace)
        run: |
          set -euo pipefail
          go work init ./protocol ./agent
          go work edit -replace github.com/nettact/protocol@v0.0.0-00010101000000-000000000000=./protocol

      - name: Gate — vet · build · test
        run: |
          set -euo pipefail
          ( cd agent && go vet ./... && go build ./... && go test ./... )

      - name: Cross-compile binaries + checksums
        run: |
          set -euo pipefail
          VERSION="${{ inputs.tag || github.ref_name }}"
          LDFLAGS="-s -w -X github.com/nettact/agent/agentrt.Version=${VERSION}"
          mkdir -p dist-bins
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            ext=""; [ "$os" = "windows" ] && ext=".exe"
            ( cd agent && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" \
                go build -trimpath -ldflags "$LDFLAGS" \
                -o "../dist-bins/nettact-agent-${os}-${arch}${ext}" ./cmd/nettact-agent )
          done
          ( cd dist-bins && sha256sum * > SHA256SUMS && cat SHA256SUMS )

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nettact-agent
          tags: |
            type=raw,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ steps.rel.outputs.is_latest }}
            type=raw,value=sha-${{ steps.rel.outputs.sha_short }}

      - name: Build & push image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: agent/ci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag || github.ref_name }}
            REVISION=${{ steps.rel.outputs.sha }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=agent
          cache-to: type=gha,mode=max,scope=agent

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, by digest)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nettact-agent
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: |
            dist-bins/nettact-agent-linux-amd64
            dist-bins/nettact-agent-linux-arm64
            dist-bins/nettact-agent-darwin-amd64
            dist-bins/nettact-agent-darwin-arm64
            dist-bins/nettact-agent-windows-amd64.exe
            dist-bins/SHA256SUMS
            agent/install.sh
            agent/install.ps1
          body: |
            ## nettact-agent ${{ inputs.tag || github.ref_name }}

            Built against `nettact/protocol@${{ steps.deps.outputs.protocol_sha }}`.

            ### Container image (linux/amd64 · linux/arm64, cosign-signed)
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/nettact-agent:${{ inputs.tag || github.ref_name }}
            ```
            Verify binary integrity with `sha256sum -c SHA256SUMS`.

  publish-r2:
    name: Publish Agent assets to R2
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLIC_BASE_URL: https://d.nettact.org/agent
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate R2 configuration
        run: |
          set -euo pipefail
          : "${R2_ACCOUNT_ID:?Set the R2_ACCOUNT_ID repository variable}"
          : "${R2_BUCKET:?Set the R2_BUCKET repository variable}"
          : "${AWS_ACCESS_KEY_ID:?Set the R2_ACCESS_KEY_ID repository secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Set the R2_SECRET_ACCESS_KEY repository secret}"

      - name: Download and verify Release assets
        run: |
          set -euo pipefail
          mkdir -p dist-out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist-out --pattern 'nettact-agent-*' --pattern 'SHA256SUMS' --pattern 'install.sh' --pattern 'install.ps1'
          expected=(
            nettact-agent-linux-amd64
            nettact-agent-linux-arm64
            nettact-agent-darwin-amd64
            nettact-agent-darwin-arm64
            nettact-agent-windows-amd64.exe
            SHA256SUMS
            install.sh
            install.ps1
          )
          for asset in "${expected[@]}"; do
            [[ -f "dist-out/$asset" ]] || {
              echo "Missing required Release asset: $asset" >&2
              exit 1
            }
          done
          (cd dist-out && sha256sum --check SHA256SUMS)
          ! grep -R 'github.com/nettact/agent/releases' dist-out/install.sh dist-out/install.ps1

      - name: Publish immutable version path
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync dist-out/ "s3://${R2_BUCKET}/agent/$TAG/" --endpoint-url "$endpoint" --delete --no-progress --only-show-errors --cache-control 'public, max-age=31536000, immutable'

      - name: Publish latest Agent assets
        if: needs.release.outputs.is_latest == 'true'
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 sync dist-out/ "s3://${R2_BUCKET}/agent/" --endpoint-url "$endpoint" --no-progress --only-show-errors --cache-control 'public, max-age=300'

      - name: Publish download summary
        run: |
          {
            echo "## R2 Agent downloads"
            echo
            echo "- Version: $TAG"
            echo "- Merged Linux/macOS/Docker installer: $PUBLIC_BASE_URL/install.sh"
            echo "- Windows installer: $PUBLIC_BASE_URL/install.ps1"
            echo "- Versioned assets: $PUBLIC_BASE_URL/$TAG/"
          } >> "$GITHUB_STEP_SUMMARY"